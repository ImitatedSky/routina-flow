schema: spec-driven

context: |
  Routina — Android 版「日常程式」自動化 App（類 Apple 捷徑 / Samsung Bixby Routines / Tasker 的極簡版）。
  Tech stack: Kotlin 2.0, Jetpack Compose (Material 3), AlarmManager, BroadcastReceiver,
  kotlinx.serialization JSON 本地儲存（無資料庫、無後端、無帳號）。
  Build: AGP 8.7, compileSdk 35, minSdk 26, targetSdk 35, R8 minify（最小輕量 APK）。
  發佈方式: 直接下載 APK 安裝（不上架商店），GitHub Actions 產出 APK artifact。
  UI 語言: 繁體中文。設計原則: 介面清楚易懂，觸發條件與動作各有專屬顏色區隔。
  原則: 最小輕量化實作，避免投機性抽象；先能動再加功能。
