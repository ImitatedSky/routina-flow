name: Build APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# 預設最小權限：一般建置（push / PR / dispatch）只需讀取原始碼。
# 只有發佈 release 的 job 才提升到 contents: write（見下）。
permissions:
  contents: read

# 同一分支/標籤的重複觸發自動取消前一個，避免兩個 release job 搶同一個 tag。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 一般建置：push / PR / 手動觸發時只做「能不能編譯」的檢查，
  # 完全不碰簽章 secret（debug 簽章 fallback 足以驗證編譯）。
  build:
    name: Build (unsigned)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # 這個 action 預設會安裝已被 Google 下架的舊 'tools' 套件，
          # runner 的 cmdline-tools 升級後 sdkmanager 就找不到它而整步失敗。
          # 平台與 build-tools 由 Gradle 自行取得，這裡只留仍然存在的 platform-tools。
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build (debug-signed fallback verifies compile)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routina-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  # 正式發佈：只在推送版本標籤（v*）時跑，是唯一動用簽章 secret 的地方。
  # 綁定 release 環境（可在 repo 設定加必要審核者 + 只允許 v* 標籤部署），
  # 並提升 contents: write 供建立 Release。
  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # 這個 action 預設會安裝已被 Google 下架的舊 'tools' 套件，
          # runner 的 cmdline-tools 升級後 sdkmanager 就找不到它而整步失敗。
          # 平台與 build-tools 由 Gradle 自行取得，這裡只留仍然存在的 platform-tools。
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 從 KEYSTORE_BASE64 secret 解碼成 keystore，以 env 傳給 Gradle 走正式簽章，
      # build 完成（或失敗）都刪除 keystore。標籤發佈缺 keystore 時直接失敗，
      # 絕不把 debug 簽章的版本當成正式 release 發出去。
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 not set; refusing to publish an unsigned release"
            exit 1
          fi
          # 密碼必須是純 ASCII。常見雷:用中文輸入法打密碼時把半形「-」變成全形「－」,
          # Java 簽章會丟「Password is not ASCII」。這裡先擋下,給明確訊息。
          for var in KEYSTORE_PASSWORD KEY_PASSWORD; do
            if printf '%s' "${!var}" | LC_ALL=C grep -q '[^ -~]'; then
              echo "::error::$var contains a non-ASCII character (e.g. a full-width dash from an IME). Re-enter it as plain ASCII by copy-paste."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          # 去掉貼上時可能夾帶的空白／換行（CR/LF），避免 base64 解碼失敗
          if ! echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 — re-copy the whole base64 file and update the secret"
            exit 1
          fi
          # 先驗證 keystore 能以密碼＋別名開啟,給出明確錯誤,而不是後面 gradle 的模糊訊息
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Cannot open keystore — check KEYSTORE_PASSWORD and KEY_ALIAS (alias should be 'routina')"
            exit 1
          fi
          export KEYSTORE_FILE="$KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 每個標籤都是獨立且永久保留的 Release，附帶版本號的 APK 檔名供依版本下載。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "routina-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" \
            "routina-${GITHUB_REF_NAME}.apk" \
            --title "Routina ${GITHUB_REF_NAME}" \
            --generate-notes
