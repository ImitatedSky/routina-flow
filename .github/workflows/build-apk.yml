name: Build APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 若設定了 KEYSTORE_BASE64 secret → 解碼成 keystore 並以 env 傳給 Gradle 走正式簽章，
      # build 完成（或失敗）都刪除 keystore；否則沿用 debug 簽章。缺 secret 不會讓 CI 失敗。
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Release signing: decoding keystore from KEYSTORE_BASE64 secret"
            KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            trap 'rm -f "$KEYSTORE_PATH"' EXIT
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            export KEYSTORE_FILE="$KEYSTORE_PATH"
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "No KEYSTORE_BASE64 secret; building with debug-signing fallback"
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: routina-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      # 推送版本標籤（v*）時，把 APK 發佈到 GitHub Releases 作為下載頁
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
